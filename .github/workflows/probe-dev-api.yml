name: Probe DEV API

# TNS DEV reachability only. Does not checkout any private repo.
# Allowed HTTP codes match e2e-run.yml resolve probe:
# 2xx / 3xx / 401 / 403 = network reached the API.
# timeout / 000 / 5xx = unreachable.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: curl DEV API
        run: |
          set -euo pipefail
          url='https://dev-app-api.thinkandspeak.com/'
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
          echo "HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "url=$url" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$code" in
            2[0-9][0-9]|3[0-9][0-9]|401|403)
              echo "DEV API reachable"
              ;;
            *)
              echo "::error::DEV API unreachable (HTTP ${code})"
              exit 1
              ;;
          esac
