name: E2E run

on:
  repository_dispatch:
    types: [e2e-run, tns-frontend-e2e]
  workflow_dispatch:
    inputs:
      owner:
        description: Target owner
        required: false
        default: Seechange-edu
        type: string
      repo:
        description: Target repo
        required: false
        default: think-and-speak-frontend
        type: string
      sha:
        description: Commit SHA (40 hex)
        required: true
        type: string
      ref:
        description: Full git ref (e.g. refs/heads/release/v1.2.3)
        required: true
        type: string
      previous:
        description: Previous v* tag for the affected range
        required: false
        type: string
      runAll:
        description: Run the full journey (manual only)
        required: false
        default: false
        type: boolean
      reason:
        description: Why this run
        required: false
        default: workflow_dispatch
        type: string
      burn:
        description: "Also run paid specs for modules this change did NOT touch (full 💸 sweep)"
        required: false
        default: false
        type: boolean
      profile:
        description: Profile id (optional; inferred from owner/repo)
        required: false
        type: string

concurrency:
  group: e2e-${{ github.event.client_payload.repo || github.event.inputs.repo || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      owner: ${{ steps.rp.outputs.owner }}
      repo: ${{ steps.rp.outputs.repo }}
      sha: ${{ steps.rp.outputs.sha }}
      ref: ${{ steps.rp.outputs.ref }}
      previous: ${{ steps.rp.outputs.previous }}
      run_all: ${{ steps.rp.outputs.run_all }}
      reason: ${{ steps.rp.outputs.reason }}
      profile_id: ${{ steps.rp.outputs.profile_id }}
      status_context: ${{ steps.rp.outputs.status_context }}
      runtime: ${{ steps.rp.outputs.runtime }}
      container: ${{ steps.rp.outputs.container }}
      playwright_version: ${{ steps.rp.outputs.playwright_version }}
      timeoutMinutes: ${{ steps.rp.outputs.timeoutMinutes }}
      shards: ${{ steps.rp.outputs.shards }}
      shard_matrix: ${{ steps.rp.outputs.shard_matrix }}
      concurrencyGroup: ${{ steps.rp.outputs.concurrencyGroup }}
      probe_url: ${{ steps.rp.outputs.probe_url }}
      install: ${{ steps.rp.outputs.install }}
      command: ${{ steps.rp.outputs.command }}
      secret_env: ${{ steps.rp.outputs.secret_env }}
      profile_env: ${{ steps.rp.outputs.profile_env }}
      skip_e2e: ${{ steps.gate.outputs.skip_e2e }}
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4

      - name: Collect payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          WD_OWNER: ${{ github.event.inputs.owner }}
          WD_REPO: ${{ github.event.inputs.repo }}
          WD_SHA: ${{ github.event.inputs.sha }}
          WD_REF: ${{ github.event.inputs.ref }}
          WD_PREVIOUS: ${{ github.event.inputs.previous }}
          WD_RUN_ALL: ${{ github.event.inputs.runAll }}
          WD_REASON: ${{ github.event.inputs.reason }}
          WD_PROFILE: ${{ github.event.inputs.profile }}
          CP_OWNER: ${{ github.event.client_payload.owner }}
          CP_REPO: ${{ github.event.client_payload.repo }}
          CP_SHA: ${{ github.event.client_payload.sha }}
          CP_REF: ${{ github.event.client_payload.ref }}
          CP_PREVIOUS: ${{ github.event.client_payload.previous }}
          CP_RUN_ALL: ${{ github.event.client_payload.runAll }}
          CP_REASON: ${{ github.event.client_payload.reason }}
          CP_PROFILE: ${{ github.event.client_payload.profile }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "E2E_OWNER=${WD_OWNER}"
              echo "E2E_REPO=${WD_REPO}"
              echo "E2E_SHA=${WD_SHA}"
              echo "E2E_REF=${WD_REF}"
              echo "E2E_PREVIOUS=${WD_PREVIOUS}"
              echo "E2E_RUN_ALL=${WD_RUN_ALL}"
              echo "E2E_REASON=${WD_REASON}"
              echo "E2E_PROFILE=${WD_PROFILE}"
              echo "E2E_EVENT_TYPE=workflow_dispatch"
            } >> "$GITHUB_ENV"
          else
            {
              echo "E2E_OWNER=${CP_OWNER}"
              echo "E2E_REPO=${CP_REPO}"
              echo "E2E_SHA=${CP_SHA}"
              echo "E2E_REF=${CP_REF}"
              echo "E2E_PREVIOUS=${CP_PREVIOUS}"
              echo "E2E_RUN_ALL=${CP_RUN_ALL}"
              echo "E2E_REASON=${CP_REASON}"
              echo "E2E_PROFILE=${CP_PROFILE}"
              echo "E2E_EVENT_TYPE=${EVENT_ACTION}"
            } >> "$GITHUB_ENV"
          fi

      - name: Resolve profile
        id: rp
        continue-on-error: true
        run: node scripts/resolve-profile.mjs

      # PAT-first (ACTION_TOKEN, same org token as the private repos). App is optional.
      - name: Mint token
        id: mint
        if: ${{ steps.rp.outputs.write_status == 'true' }}
        uses: ./.github/actions/mint-token
        with:
          app-id: ${{ secrets.E2E_APP_ID }}
          app-private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          pat: ${{ secrets.ACTION_TOKEN }}
          owner: ${{ steps.rp.outputs.owner }}
          repo: ${{ steps.rp.outputs.repo }}

      - name: Status error on resolve failure
        if: ${{ steps.rp.outcome == 'failure' && steps.rp.outputs.write_status == 'true' }}
        uses: ./.github/actions/write-status
        with:
          token: ${{ steps.mint.outputs.token }}
          owner: ${{ steps.rp.outputs.owner }}
          repo: ${{ steps.rp.outputs.repo }}
          sha: ${{ steps.rp.outputs.sha }}
          state: error
          context: ${{ steps.rp.outputs.status_context }}
          target-url: ${{ env.RUN_URL }}
          description: ${{ steps.rp.outputs.error_message }}

      - name: Fail if resolve failed
        if: ${{ steps.rp.outcome == 'failure' }}
        run: exit 1

      # Kill switch: repository variable E2E_ENABLED. Only the string `false`
      # (any case) skips Playwright. Unset / true / anything else RUNS — a
      # missing variable must not silently green the gate (the private repo's
      # old `force` default did that).
      - name: Gate on E2E_ENABLED
        id: gate
        env:
          E2E_ENABLED_RAW: ${{ vars.E2E_ENABLED }}
        run: |
          set -euo pipefail
          v=$(printf '%s' "${E2E_ENABLED_RAW:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if [ "$v" = "false" ]; then
            echo "skip_e2e=true" >> "$GITHUB_OUTPUT"
            echo "E2E_ENABLED=${E2E_ENABLED_RAW} → skip Playwright, report success on the SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "skip_e2e=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Status pending
        if: ${{ steps.gate.outputs.skip_e2e != 'true' }}
        uses: ./.github/actions/write-status
        with:
          token: ${{ steps.mint.outputs.token }}
          owner: ${{ steps.rp.outputs.owner }}
          repo: ${{ steps.rp.outputs.repo }}
          sha: ${{ steps.rp.outputs.sha }}
          state: pending
          context: ${{ steps.rp.outputs.status_context }}
          target-url: ${{ env.RUN_URL }}
          description: queued on e2e-runner

      - name: Probe API
        id: probe
        if: ${{ steps.gate.outputs.skip_e2e != 'true' }}
        continue-on-error: true
        env:
          PROBE_URL: ${{ steps.rp.outputs.probe_url }}
        run: |
          set -euo pipefail
          if [ -z "${PROBE_URL}" ]; then
            echo "No probe URL configured"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$PROBE_URL" || true)
          echo "HTTP $code for $PROBE_URL" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$code" in
            2[0-9][0-9]|3[0-9][0-9]|401|403)
              echo "API reachable"
              ;;
            *)
              echo "::error::target API unreachable (HTTP ${code}) at ${PROBE_URL}"
              exit 1
              ;;
          esac

      - name: Status failure on unreachable API
        if: ${{ steps.probe.outcome == 'failure' }}
        uses: ./.github/actions/write-status
        with:
          token: ${{ steps.mint.outputs.token }}
          owner: ${{ steps.rp.outputs.owner }}
          repo: ${{ steps.rp.outputs.repo }}
          sha: ${{ steps.rp.outputs.sha }}
          state: failure
          context: ${{ steps.rp.outputs.status_context }}
          target-url: ${{ env.RUN_URL }}
          description: target API unreachable

      - name: Fail if API unreachable
        if: ${{ steps.probe.outcome == 'failure' }}
        run: exit 1

  run-playwright:
    needs: resolve
    if: ${{ needs.resolve.result == 'success' && needs.resolve.outputs.runtime == 'playwright' && needs.resolve.outputs.skip_e2e != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.resolve.outputs.timeoutMinutes) }}
    container: ${{ needs.resolve.outputs.container }}
    # Container default shell is `sh` (dash). `set -o pipefail` needs bash.
    defaults:
      run:
        shell: bash
    # One runner per shard. `shard_matrix` is [0] when the profile does not set
    # `shards`, so an unsharded profile still gets exactly one job.
    #
    # `fail-fast: false` because these are not attempts at the same thing —
    # they are different thirds of the suite. Cancelling the survivors the
    # moment one goes red would hide every other failure behind the first one,
    # and would report the cancelled shards as "did not finish" (see finalize),
    # which is not what happened to them.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.resolve.outputs.shard_matrix) }}
    # 🔴 The shard index MUST be in the group name. Job-level concurrency with
    # `cancel-in-progress: false` does not run same-group jobs side by side, it
    # QUEUES them — so a single shared group would have executed the three
    # shards one after another and made this whole change a no-op that also
    # tripled the checkout cost. The group still keeps two different releases
    # off the same shard's accounts, which is what it was always for.
    concurrency:
      group: ${{ needs.resolve.outputs.concurrencyGroup }}-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4
        with:
          path: runner

      - name: Mint token
        id: mint
        uses: ./runner/.github/actions/mint-token
        with:
          app-id: ${{ secrets.E2E_APP_ID }}
          app-private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          pat: ${{ secrets.ACTION_TOKEN }}
          owner: ${{ needs.resolve.outputs.owner }}
          repo: ${{ needs.resolve.outputs.repo }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.owner }}/${{ needs.resolve.outputs.repo }}
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ steps.mint.outputs.token }}
          path: app
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Detach at SHA
        working-directory: app
        run: git checkout --detach "${{ needs.resolve.outputs.sha }}"

      - name: Enable Yarn 1.22.22
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install
        working-directory: app
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.playwright.dev
        run: ${{ needs.resolve.outputs.install }}

      # Non-secret, profile-pinned variables (E2E_ENV, shard index). They live
      # in profiles.json so a second product can target its own environment
      # without this workflow being edited.
      - name: Apply profile environment
        env:
          PROFILE_ENV: ${{ needs.resolve.outputs.profile_env }}
        run: |
          set -euo pipefail
          export PE="${PROFILE_ENV:-}"
          if [ -z "$PE" ]; then PE='{}'; fi
          node -e "const e=JSON.parse(process.env.PE||'{}');for(const [k,v] of Object.entries(e))console.log(k+'='+v)" | tee -a "$GITHUB_ENV"

      # There used to be ten account secrets here — an EMAIL and a PASSWORD per
      # role. Emails are not secrets (they were already committed in plain text
      # in the private repo), and per-role passwords bought no isolation: they
      # all sat in this one store and would leak together. The roster now lives
      # in the private repo's tests/e2e/accounts.ts, reviewed in a PR, and every
      # account shares ONE password. Adding a shard is an array entry there, not
      # an org-admin ticket here. Solution doc §0.5.4.
      - name: Require the account password
        env:
          E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${E2E_ACCOUNT_PASSWORD:-}" ]; then
            echo "::error::Repository secret E2E_ACCOUNT_PASSWORD is not set. Every E2E account shares it; the private suite deliberately has no fallback password, so the run would fail deep inside a login step instead of here."
            exit 1
          fi

      - name: Run tests
        working-directory: app
        env:
          CI: true
          PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.playwright.dev
          E2E_RELEASE_REF: ${{ needs.resolve.outputs.ref }}
          E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
          # Which slice of the suite, and which learner pair to drive it with.
          # The two indices are deliberately the SAME number: shard k reads
          # account group k (tests/e2e/accounts.ts), so "which runner" and "whose
          # data" never have to be correlated by hand when a spec goes red.
          #
          # Set here rather than in profiles.json `env` because only the matrix
          # knows the index; a step-level `env` also wins over the GITHUB_ENV
          # the "Apply profile environment" step wrote, so there is one source
          # of truth for it and it is this one.
          E2E_ACCOUNT_GROUP: ${{ matrix.shard }}
          E2E_SHARD_INDEX: ${{ matrix.shard }}
          E2E_SHARD_TOTAL: ${{ needs.resolve.outputs.shards }}
          # 🔴 One blob per shard, and the FILE NAME has to say which. The
          # private repo's playwright.config.ts writes `blob` on CI; its
          # default output is `blob-report/report.zip` on every runner, because
          # Playwright only auto-numbers that name when it is driving its OWN
          # `--shard` — which this suite deliberately does not use. Without
          # this line the merge job would flatten three identically named files
          # into one directory and silently keep whichever landed last.
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-shard${{ matrix.shard }}.zip
          # 💸 The paid specs (tests/e2e/burn.ts) are NOT excluded wholesale:
          # run-affected.mjs keeps every one whose module the change actually
          # touched, so a release that modifies a paid path still has to get
          # that path green. This flag is the separate "run all 16 regardless
          # of what changed" lever — the scheduled sweep that catches drift in
          # modules nobody has touched for a while, and manual debugging.
          E2E_BURN: ${{ (github.event.client_payload.burn == true || github.event.inputs.burn == 'true') && '1' || '' }}
        run: ${{ needs.resolve.outputs.command }}

      # 🔴 `if: always()` is the whole point. The results only matter when the
      # run went red or ran out of time, which are exactly the cases a default
      # (success-only) step skips. Before this existed the report was written
      # inside the container and destroyed with it, so a flaky release gate left
      # nothing to read but Playwright's one-line summary — and an overrun left
      # not even that.
      #
      # What goes up is the BLOB, not a browsable report. Each shard's blob is
      # one zip holding that shard's events and its attachments exactly once;
      # `merge-report` below folds all of them into a single HTML report for the
      # whole run, so a human downloads ONE artifact instead of one per shard.
      #
      # 🔴 `app/test-results/` is deliberately gone. Under the html reporter it
      # was a byte-for-byte DUPLICATE of `playwright-report/data/` — Playwright's
      # reporters/html.js copies every attachment across — so the old artifact
      # shipped every trace and every 1.3 MB failure screenshot twice. blob does
      # not produce that directory at all. The one thing lost with it is the
      # narrow window where Playwright dies so hard it never writes a report:
      # a job killed by `timeout-minutes` never reaches this step either way,
      # and a clean `globalTimeout` expiry does write the blob.
      #
      # `if-no-files-found: ignore` because a job killed before Playwright
      # started has no blob, and because a shard that owns no modules exits
      # before Playwright runs at all (run-affected.mjs). A missing artifact
      # must not turn a real result into a second, unrelated failure.
      #
      # One day of retention: this is an INTERMEDIATE whose only consumer is the
      # next job, in this same run. It outlives the run only so a broken merge
      # can be redone by hand from the blobs, instead of by re-running the whole
      # suite against real accounts and real quota.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The shard suffix is not cosmetic: upload-artifact@v4 refuses a
          # second upload under a name that already exists, so without it two
          # shards finishing together fail the job over an artifact name.
          name: blob-report-${{ needs.resolve.outputs.sha }}-shard${{ matrix.shard }}
          path: app/blob-report/
          if-no-files-found: ignore
          retention-days: 1

  # ── ONE report per run, not one per shard ──────────────────────────────────
  # Sharding multiplied the reporting by three: three artifacts to download,
  # three reports to open, and the reader's first question became "which third
  # of the suite was this failure in" — a question nobody should have to ask.
  # This job answers it by merging the shards' blobs back together.
  #
  # It does NOT gate anything. `finalize` writes the commit status and does not
  # depend on this job, so a bug in the merge can never turn a green suite red;
  # it shows up as a red merge-report job and nothing else.
  merge-report:
    needs: [resolve, run-playwright]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.runtime == 'playwright' && needs.resolve.outputs.skip_e2e != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 🔴 No `container:` on purpose. Merging needs Node and the Playwright CLI,
    # never a browser, and pulling the ~2 GB Playwright image to unzip a few
    # reports would cost more wall clock than the merge itself.
    defaults:
      run:
        shell: bash
    steps:
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-${{ needs.resolve.outputs.sha }}-shard*
          path: blobs
          # Flatten every shard's artifact into ONE directory, which is what
          # `merge-reports` reads. Safe only because each shard named its file
          # report-shard<k>.zip (PLAYWRIGHT_BLOB_OUTPUT_FILE above); with the
          # default name this line would overwrite two reports with the third.
          merge-multiple: true

      - name: Merge blobs into one HTML report
        env:
          PW_VERSION: ${{ needs.resolve.outputs.playwright_version }}
          # This host has no browsers and needs none. Without it the npx install
          # would download a browser set just to unzip some reports.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          # Pin where the merged report lands. merge-reports resolves the html
          # output dir against the nearest playwright.config it can find, and
          # only falls back to the cwd when there is none — verified locally:
          # run from inside a repo it writes the report at that REPO's root,
          # not beside the blobs. This job has no checkout so the fallback
          # would apply, but the upload paths below depend on this location
          # and must not rest on the absence of a file.
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
        run: |
          set -euo pipefail
          if [ -z "$(ls -A blobs 2>/dev/null || true)" ]; then
            echo "No blob reports: every shard died before Playwright wrote one, or the whole matrix was skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${PW_VERSION:-}" ]; then
            echo "::error::Could not read a Playwright version off the profile container. merge-reports must run the SAME version that wrote the blobs or it fails on a report-format mismatch. Tag the profile's container :v<x.y.z>."
            exit 1
          fi
          ls -l blobs
          npx --yes "playwright@${PW_VERSION}" merge-reports --reporter html blobs
          # 🔴 Pin the artifact root. upload-artifact derives it from the least
          # common ancestor of what it matched, so if `trace/` happened not to
          # exist (a failure with a screenshot but no trace) the attachments
          # artifact would unzip as loose sha1 files instead of `data/` +
          # `trace/` — and would no longer drop into place beside index.html.
          mkdir -p playwright-report/data playwright-report/trace

      # ── the artifact you actually open ─────────────────────────────────────
      # index.html is self-contained: Playwright base64-embeds the entire report
      # — every test, its error, its duration, its stdout — inside it. A couple
      # of MB, and it answers "what failed and why" without downloading one
      # trace. This is the tier worth keeping for a fortnight.
      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ needs.resolve.outputs.sha }}
          path: playwright-report/index.html
          if-no-files-found: ignore
          retention-days: 14

      # ── the heavy half, kept apart on purpose ──────────────────────────────
      # Traces and failure screenshots: tens of MB on a red run, and only ever
      # wanted for the few days somebody is actually debugging it. Unzip this
      # NEXT TO the report above — both artifacts are rooted at
      # `playwright-report/` — and index.html's trace links resolve again.
      - name: Upload merged report attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ needs.resolve.outputs.sha }}
          path: |
            playwright-report/data/
            playwright-report/trace/
          if-no-files-found: ignore
          retention-days: 5

  finalize:
    needs: [resolve, run-playwright]
    # Gate on "do we know which SHA to report on", not on "did resolve succeed".
    # `needs.resolve.result == 'success'` left a hole: resolve can resolve the
    # profile, write its `pending`, and THEN fail or be cancelled — and this job
    # was skipped, so nothing ever wrote back and the SHA stayed pending
    # forever. Reading the output instead covers every case where a status is
    # both possible and owed. Solution doc §0.5.7 #4c.
    #
    # It does NOT cover a resolve cancelled before it produced outputs: the SHA
    # is genuinely unknown then, and nothing here can report on it. That
    # residual hole is what the private repo's e2e-gate-watchdog.yml is for.
    if: ${{ always() && needs.resolve.outputs.sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4

      - name: Mint token
        id: mint
        uses: ./.github/actions/mint-token
        with:
          app-id: ${{ secrets.E2E_APP_ID }}
          app-private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          pat: ${{ secrets.ACTION_TOKEN }}
          owner: ${{ needs.resolve.outputs.owner }}
          repo: ${{ needs.resolve.outputs.repo }}

      - name: Pick final status
        id: final
        env:
          PW_RESULT: ${{ needs.run-playwright.result }}
          RUN_ALL: ${{ needs.resolve.outputs.run_all }}
          SKIP_E2E: ${{ needs.resolve.outputs.skip_e2e }}
        run: |
          set -euo pipefail
          if [ "$SKIP_E2E" = "true" ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=skipped — E2E_ENABLED=false" >> "$GITHUB_OUTPUT"
          elif [ "$PW_RESULT" = "success" ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            if [ "$RUN_ALL" = "true" ]; then
              echo "description=full journey" >> "$GITHUB_OUTPUT"
            else
              echo "description=affected journey" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$PW_RESULT" = "skipped" ]; then
            echo "state=error" >> "$GITHUB_OUTPUT"
            echo "description=runtime not implemented" >> "$GITHUB_OUTPUT"
          elif [ "$PW_RESULT" = "cancelled" ]; then
            # NOT a test result either way. Reporting it as `failure` told the
            # publisher the journey went red when in fact something else took
            # the slot. `error` keeps the tip non-green (this SHA really was
            # not verified) without accusing the code.
            # Solution doc §0.5.7 #8.
            #
            # 🔴 The text used to say "superseded", flatly. Two different things
            # land here and this job cannot tell them apart: a newer push
            # cancelling this one, and the job exceeding `timeout-minutes`.
            # Asserting the first sent people hunting for a push that did not
            # exist, while the suite was quietly overrunning its budget. Say
            # both and let the uploaded artifact decide — a blob-report-*
            # artifact for this shard means the clock ran out, no artifact at
            # all means it was superseded.
            echo "state=error" >> "$GITHUB_OUTPUT"
            echo "description=superseded or timed out — did not finish" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=e2e-runner failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Write final status
        uses: ./.github/actions/write-status
        with:
          token: ${{ steps.mint.outputs.token }}
          owner: ${{ needs.resolve.outputs.owner }}
          repo: ${{ needs.resolve.outputs.repo }}
          sha: ${{ needs.resolve.outputs.sha }}
