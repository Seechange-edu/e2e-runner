name: Mint GitHub token
description: Prefer E2E_TOKEN (fine-grained PAT). GitHub App is optional.

inputs:
  app-id:
    required: false
    default: ''
  app-private-key:
    required: false
    default: ''
  pat:
    required: false
    default: ''
  owner:
    required: true
  repo:
    required: true

outputs:
  token:
    description: PAT or App installation token
    value: ${{ steps.pick.outputs.token }}

runs:
  using: composite
  steps:
    # PAT-first so an unset E2E_APP_ID never invokes create-github-app-token.
    - name: Use PAT
      id: pat
      if: ${{ inputs.pat != '' }}
      shell: bash
      env:
        PAT: ${{ inputs.pat }}
      run: echo "token=${PAT}" >> "$GITHUB_OUTPUT"

    - name: Create GitHub App token
      id: app
      if: ${{ inputs.pat == '' && inputs.app-id != '' }}
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repo }}

    - name: Pick token
      id: pick
      shell: bash
      env:
        PAT_TOKEN: ${{ steps.pat.outputs.token }}
        APP_TOKEN: ${{ steps.app.outputs.token }}
      run: |
        set -euo pipefail
        if [ -n "${PAT_TOKEN:-}" ]; then
          echo "token=${PAT_TOKEN}" >> "$GITHUB_OUTPUT"
        elif [ -n "${APP_TOKEN:-}" ]; then
          echo "token=${APP_TOKEN}" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Set repository secret E2E_TOKEN (fine-grained PAT on the target private repo: Contents Read + Commit statuses Write). GitHub App secrets are optional."
          exit 1
        fi
